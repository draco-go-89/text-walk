<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXT WALK</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ff3b30;
            --panel-bg: rgba(20, 20, 20, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        /* Settings Overlay */
        #settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #settings-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255,255,255,0.1);
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 50px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        .speed-control {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
            accent-color: var(--accent-color);
            margin-top: 15px;
        }

        button.start-btn {
            width: 100%;
            padding: 18px;
            margin-top: 30px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2);
        }

        button.start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 59, 48, 0.3);
        }

        button.start-btn:active {
            transform: translateY(1px);
        }

        .dev-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #555;
            font-size: 0.85rem;
        }

        .dev-name {
            color: #aaa;
            font-weight: 700;
            font-size: 1rem;
            display: block;
            margin-top: 4px;
        }

        /* Display Area */
        #display-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            white-space: nowrap;
            pointer-events: none;
        }

        #scrolling-text {
            font-size: 75vh;
            font-weight: 900;
            line-height: 1;
            padding-left: 100vw;
            display: inline-block;
            will-change: transform;
        }

        /* Nav Button */
        #nav-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            opacity: 0.1;
        }

        #nav-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        #nav-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
            opacity: 0.8;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

    </style>
</head>
<body>

    <!-- Settings Panel -->
    <div id="settings-panel">
        <div class="container">
            <h1>TEXT WALK</h1>

            <div class="input-group">
                <label for="text-input">Message</label>
                <input type="text" id="text-input" placeholder="Type something..." value="TEXT WALK">
            </div>

            <div class="controls-row">
                <div class="control-item">
                    <label for="text-color">Text Color</label>
                    <input type="color" id="text-color" value="#ffffff">
                </div>
                <div class="control-item">
                    <label for="bg-color">Background</label>
                    <input type="color" id="bg-color" value="#000000">
                </div>
            </div>

            <div class="input-group speed-control">
                <label for="speed-input" id="speed-label">Speed: Normal</label>
                <input type="range" id="speed-input" min="1" max="100" value="50" step="1">
            </div>

            <button class="start-btn" onclick="startWalk()">START WALK</button>

            <div class="dev-info">
                Developed by
                <span class="dev-name">Dhrubo Basumatary</span>
                <span style="opacity: 0.6; font-size: 0.75rem;">SOFTWARE DEVELOPER</span>
            </div>
        </div>
    </div>

    <!-- Display Area -->
    <div id="display-area">
        <div id="scrolling-text">TEXT WALK</div>
    </div>

    <!-- Nav Button (Settings Toggle) -->
    <div id="nav-btn" onclick="toggleSettings()">
        <svg viewBox="0 0 24 24">
            <path d="M12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zM19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"></path>
        </svg>
    </div>

    <script>
        const settingsPanel = document.getElementById('settings-panel');
        const textInput = document.getElementById('text-input');
        const textColorInput = document.getElementById('text-color');
        const bgColorInput = document.getElementById('bg-color');
        const speedInput = document.getElementById('speed-input');
        const speedLabel = document.getElementById('speed-label');
        const scrollingText = document.getElementById('scrolling-text');

        function updateSpeedLabel() {
            const val = speedInput.value;
            let label = "Normal";
            if (val < 30) label = "Slow";
            if (val > 70) label = "Fast";
            if (val > 90) label = "Huge Speed";
            speedLabel.textContent = `Speed: ${label}`;
        }

        speedInput.addEventListener('input', updateSpeedLabel);

        function startWalk() {
            const text = textInput.value || "TEXT WALK";
            const textColor = textColorInput.value;
            const bgColor = bgColorInput.value;
            const speed = parseInt(speedInput.value);

            document.body.style.backgroundColor = bgColor;
            scrollingText.style.color = textColor;
            scrollingText.textContent = text;

            // Reset animation
            scrollingText.style.animation = 'none';
            scrollingText.offsetHeight; // trigger reflow

            // Calculate duration: 100 (fastest) -> ~2s, 1 (slowest) -> ~40s
            const duration = 40 - (speed * 0.38);

            scrollingText.style.animation = `scroll ${duration}s linear infinite`;

            settingsPanel.classList.add('hidden');
        }

        function toggleSettings() {
            settingsPanel.classList.toggle('hidden');
        }

        // Init
        updateSpeedLabel();
    </script>
</body>
</html>
